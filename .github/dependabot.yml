# Monthly dependency updates, grouped per ecosystem so minor and patch bumps arrive
# together and major bumps stay separate PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
